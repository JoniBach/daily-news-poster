<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            /* background: #e9d0a9; */
            /* background: #12120f; */
            background: black;
        }
        
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .russo-one-regular {
          font-family: "Russo One", sans-serif;
          font-weight: 400;
          font-style: normal;
        }
        
        @media (max-width: 768px) {
            #datetime {
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            #datetime {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <img alt="Poster">
    <div id="datetime" class="russo-one-regular" style="position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); color: #12120f; font-size: 24px; text-shadow: -1px -1px 0 #e9d0a9, 1px -1px 0 #e9d0a9, -1px 1px 0 #e9d0a9, 1px 1px 0 #e9d0a9, -2px -2px 0 #ae3218, 2px -2px 0 #ae3218, -2px 2px 0 #ae3218, 2px 2px 0 #ae3218;"></div>
    <script>
        let today = new Date().toISOString().split('T')[0];
        document.querySelector('img').src = `https://cnitzqqchvvmpvqtxuvj.supabase.co/storage/v1/object/public/news-posters/poster-${today}.png`;
        
        setInterval(() => {
            document.getElementById('datetime').innerHTML = new Date().toLocaleString();
        }, 1000);
        
        setInterval(() => {
            const currentDate = new Date().toISOString().split('T')[0];
            if (currentDate !== today) {
                today = currentDate;
                document.querySelector('img').src = `https://cnitzqqchvvmpvqtxuvj.supabase.co/storage/v1/object/public/news-posters/poster-${today}.png`;
            }
        }, 3600000);
    </script>
</body>
</html>
